<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2BC48A"><link rel="apple-touch-icon" href="icon-192.png"><title>Dilo – Yapay zekâ ile dil öğren</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5FB;--card:#fff;--ink:#1B2A49;--mut:#6B7690;--mint:#2BC48A;--sun:#FFC043;--coral:#FF6B6B;--line:#E3E3F0;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A2E;--card:#1B2744;--ink:#EEF1FA;--mut:#9AA6C4;--line:#2C3A5E}}
:root[data-theme="dark"]{--bg:#121A2E;--card:#1B2744;--ink:#EEF1FA;--mut:#9AA6C4;--line:#2C3A5E}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;font-weight:500;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative}
.top{display:flex;gap:8px;justify-content:space-between;padding:10px 16px;font-weight:800}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:2px 12px}
main{flex:1;overflow-y:auto;padding:4px 16px 16px}
nav{display:flex;border-top:2px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;padding:8px 0;font:inherit;color:var(--mut);font-size:12px}
nav button b{display:block;font-size:22px;font-weight:500}nav .on{color:var(--mint);font-weight:800}
h1{font-size:30px;line-height:1.1;margin:8px 0}h2{font-size:22px;margin:10px 0 6px}p{margin:6px 0;color:var(--mut)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.btn{display:block;width:100%;border:0;border-bottom:4px solid #1E9467;background:var(--mint);color:#fff;font:inherit;font-weight:800;font-size:17px;padding:10px;border-radius:16px;margin:8px 0;cursor:pointer;text-align:center;text-decoration:none}
.btn.alt{background:var(--sun);border-color:#D49A1F;color:#3a2a00}.btn.ghost{background:none;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5}
input,textarea,select{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);margin:4px 0}
textarea{min-height:110px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.node{width:70px;height:70px;border-radius:50%;border:0;border-bottom:6px solid #1E9467;background:var(--mint);font-size:28px;cursor:pointer;color:#fff}
.node.done{background:var(--sun);border-color:#D49A1F}.node.lock{background:var(--line);border-color:var(--mut);opacity:.7;cursor:default}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:700;font-size:18px;padding:12px;margin:8px 0;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.opt.ok{border-color:var(--mint);background:rgba(43,196,138,.18)}.opt.no{border-color:var(--coral);background:rgba(255,107,107,.18)}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.av{width:120px;height:120px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.av small{position:absolute;top:-6px;right:0;font-size:34px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{border:2px solid var(--line);border-radius:16px;padding:8px;text-align:center;background:var(--card);font:inherit;color:var(--ink);cursor:pointer}
.item.eq{border-color:var(--mint)}.item span{display:block;font-size:30px}
.msg{padding:8px 12px;border-radius:16px;margin:6px 0;max-width:85%}.me{background:var(--mint);color:#fff;margin-left:auto}.ai{background:var(--card);border:2px solid var(--line)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:700}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
</style></head><body><div id="app"></div>
<script>
const LANGS={en:{n:'İngilizce',c:'en-US',q:[['“Apple” ne demek?',['Elma','Armut','Kiraz'],0],['“I am hungry” ne demek?',['Yorgunum','Açım','Mutluyum'],1],['“Thank you” ne demek?',['Teşekkürler','Merhaba','Lütfen'],0],['“Good morning” ne demek?',['İyi geceler','Günaydın','Hoşça kal'],1]]},
es:{n:'İspanyolca',c:'es-ES',q:[['“Gracias” ne demek?',['Lütfen','Teşekkürler','Merhaba'],1],['“Agua” ne demek?',['Su','Ateş','Ekmek'],0],['“Buenos días” ne demek?',['İyi akşamlar','Günaydın','Güle güle'],1],['“Casa” ne demek?',['Araba','Ev','Kedi'],1]]},
de:{n:'Almanca',c:'de-DE',q:[['“Danke” ne demek?',['Teşekkürler','Evet','Hayır'],0],['“Wasser” ne demek?',['Süt','Su','Çay'],1],['“Guten Morgen” ne demek?',['Günaydın','İyi geceler','Merhaba'],0],['“Haus” ne demek?',['Ev','Kapı','Masa'],0]]}};
const TOP=['Selamlaşma','Yiyecek','Alışveriş','Seyahat','Aile','İş hayatı','Hava durumu','Hobiler'];
const FACES=['🙂','😎','🤓','🥳','🦊','🐼'],ACCS=['','🎩','👑','🕶️','🎧','🌸'],BGS=['#FFC043','#2BC48A','#FF6B6B','#7C8CFF','#FF9AD5'];
const SHOP=[['👑',30],['🎩',20],['🕶️',15],['🎧',25],['🌸',10]];
let S={key:'',lang:'en',level:'A1',xp:0,gems:20,streak:1,idx:0,face:'🙂',acc:'',bg:'#FFC043',own:[''],chest:false,step:0,tab:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('dilo')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('dilo',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),A=$('#app');let L=null,chat=[],toastT;
function toast(t){clearTimeout(toastT);let e=document.createElement('div');e.className='toast';e.textContent=t;A.appendChild(e);toastT=setTimeout(()=>e.remove(),1800)}
async function ai(prompt){
 if(!S.key)throw new Error('no key');
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key='+encodeURIComponent(S.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`Sen sabırlı bir ${LANGS[S.lang].n} öğretmenisin. Öğrencinin seviyesi ${S.level}. Türkçe açıkla, kısa ve cesaretlendirici ol.\n\n${prompt}`}]}]})});
 const d=await r.json();return d.candidates[0].content.parts[0].text}
async function aiOr(prompt,demo){try{return await ai(prompt)}catch(e){return demo+'\n\n(Demo yanıtı: bu önizlemede Gemini’ye bağlanılamadı. Gerçek uygulamada yanıtı yapay zekâ üretir.)'}}
function hdr(){return `<div class="top"><span class="chip">🔥 ${S.streak}</span><span class="chip">⭐ ${S.xp} XP</span><span class="chip">💎 ${S.gems}</span></div>`}
function avatar(){return `<div class="av" style="background:${S.bg}">${S.face}<small>${S.acc}</small></div>`}
function render(){
 if(S.step<2)return onboard();
 const t=S.tab,v=[path,practice,shop,profile][t]();
 A.innerHTML=hdr()+`<main>${v}</main><nav>${['🗺️|Yol','🎤|Pratik','🛍️|Mağaza','👤|Profil'].map((x,i)=>`<button class="${i==t?'on':''}" onclick="S.tab=${i};L=null;render()"><b>${x.split('|')[0]}</b>${x.split('|')[1]}</button>`).join('')}</nav>`;
 save()}
function onboard(){
 if(S.step==0){A.innerHTML=`<main style="padding-top:40px"><h1>Dilo’ya hoş geldin 👋</h1><p>Sonsuz, sana özel dil dersleri için Google AI Studio’dan ücretsiz bir API anahtarı al ve buraya yapıştır.</p>
 <a class="btn alt" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio’da anahtar al</a>
 <input id="k" type="password" placeholder="API anahtarını yapıştır" value="${S.key}">
 <button class="btn" onclick="S.key=$('#k').value.trim();S.step=1;render()">Devam et</button>
 <button class="btn ghost" onclick="S.key='';S.step=1;render()">Şimdilik demo ile dene</button>
 <p>Anahtarın yalnızca bu cihazda saklanır.</p></main>`;return}
 A.innerHTML=`<main style="padding-top:40px"><h1>Ne öğrenmek istiyorsun?</h1>
 <select id="l">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select>
 <h2>Seviyen</h2><select id="v">${['A1 – Yeni başlıyorum','A2 – Temel cümleler kurarım','B1 – Sohbet edebilirim','B2 – Akıcıyım'].map(x=>`<option value="${x.slice(0,2)}">${x}</option>`).join('')}</select>
 <button class="btn" onclick="S.lang=$('#l').value;S.level=$('#v').value;S.step=2;render()">Öğrenmeye başla</button></main>`}
function path(){
 const n=S.idx+6;let h=`<div class="card"><b>Günlük hedef</b><div class="bar"><i style="width:${Math.min(100,S.xp%50*2)}%"></i></div></div>`;
 h+=`<button class="btn alt" ${S.chest?'disabled':''} onclick="S.chest=true;S.gems+=10;toast('+10 💎 günlük sandık!');render()">${S.chest?'Sandık açıldı':'🎁 Günlük sandığı aç'}</button><div class="path">`;
 for(let i=0;i<n;i++){const st=i<S.idx?'done':i==S.idx?'':'lock';h+=`<button class="node ${st}" style="margin-left:${[0,60,0,-60][i%4]}px" ${i==S.idx?`onclick="start()"`:''} title="${TOP[i%8]}">${i<S.idx?'✓':i==S.idx?'▶':'🔒'}</button><small style="margin:-10px 0 0">${TOP[i%8]}</small>`}
 return h+`</div><p style="text-align:center">Yol bitmez: yapay zekâ her ders sonunda yenisini üretir.</p>`}
function start(){const q=LANGS[S.lang].q;L={i:0,ok:0,q};lesson()}
function lesson(){
 const q=L.q[L.i];A.innerHTML=hdr()+`<main><div class="bar"><i style="width:${L.i/L.q.length*100}%"></i></div><h2>${q[0]}</h2>${q[1].map((o,j)=>`<button class="opt" onclick="ans(${j},this)">${o}</button>`).join('')}<div id="fb"></div></main>`}
function ans(j,b){
 const q=L.q[L.i],ok=j==q[2];document.querySelectorAll('.opt').forEach((o,k)=>{o.disabled=true;if(k==q[2])o.classList.add('ok')});if(!ok)b.classList.add('no');else L.ok++;
 $('#fb').innerHTML=`<button class="btn" onclick="nextQ()">${L.i+1<L.q.length?'Sonraki':'Bitir'}</button>`}
function nextQ(){L.i++;if(L.i<L.q.length)return lesson();const g=L.ok*3,x=L.ok*10;S.xp+=x;S.gems+=g;S.idx++;S.streak=Math.max(S.streak,1)+(S.chest?0:0);L=null;
 A.innerHTML=hdr()+`<main style="text-align:center;padding-top:50px"><div style="font-size:70px">🎉</div><h1>Ders bitti!</h1><p>${L?'':''}+${x} XP · +${g} 💎</p><button class="btn" onclick="S.tab=0;render()">Yola dön</button></main>`;save()}
let sub=0;
function practice(){
 const tabs=`<div class="row">${['✍️ Yaz','🎙️ Konuş','💬 Sohbet'].map((x,i)=>`<button class="btn ${sub==i?'':'ghost'}" onclick="sub=${i};render()">${x}</button>`).join('')}</div>`;
 if(sub==0)return tabs+`<h2>Bir paragraf yaz</h2><p>${LANGS[S.lang].n} yaz, yapay zekâ düzeltsin.</p><textarea id="w" placeholder="Bugün ne yaptın?"></textarea><button class="btn" onclick="fix()">Geri bildirim al</button><div id="o"></div>`;
 if(sub==1)return tabs+`<h2>Mikrofonla konuş</h2><p>Düğmeye bas, ${LANGS[S.lang].n} bir cümle söyle.</p><button class="btn alt" onclick="mic()">🎙️ Konuşmaya başla</button><div id="o" class="card" style="display:none"></div>`;
 return tabs+`<h2>Karşılıklı sohbet</h2><div id="ch">${chat.map(m=>`<div class="msg ${m[0]}">${m[1]}</div>`).join('')||'<p>Merhaba yazarak başla.</p>'}</div><div class="row"><input id="c" placeholder="Mesajın…" onkeydown="if(event.key=='Enter')send()"><button class="btn" style="flex:0 0 80px" onclick="send()">Gönder</button></div>`}
async function fix(){const t=$('#w').value.trim();if(!t)return;$('#o').innerHTML='<p>Okuyorum…</p>';const r=await aiOr(`Şu paragrafı düzelt, hataları kısaca açıkla ve düzeltilmiş halini ver:\n${t}`,'Düzeltilmiş halini ve hataları burada görürsün. Güzel bir başlangıç!');$('#o').innerHTML=`<div class="card" style="white-space:pre-wrap">${r.replace(/</g,'&lt;')}</div>`;S.xp+=15;save()}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition,o=$('#o');o.style.display='block';
 if(!R){o.textContent='Bu tarayıcı mikrofon tanımayı desteklemiyor. Mobil uygulamada cihazın konuşma tanıma özelliği kullanılır.';return}
 const r=new R();r.lang=LANGS[S.lang].c;o.textContent='Dinliyorum…';r.onresult=async e=>{const t=e.results[0][0].transcript;o.innerHTML=`<b>Duyduğum:</b> ${t.replace(/</g,'&lt;')}<p id="f">Telaffuz geri bildirimi hazırlanıyor…</p>`;const f=await aiOr(`Öğrenci şunu söyledi: "${t}". Dilbilgisi ve doğallık açısından kısa geri bildirim ver.`,'Cümlen anlaşılır! Biraz daha akıcı söylemek için vurguya dikkat et.');$('#f').textContent=f;S.xp+=15;save()};r.onerror=()=>o.textContent='Mikrofon izni verilmedi veya ses alınamadı.';r.start()}
async function send(){const t=$('#c').value.trim();if(!t)return;chat.push(['me',t.replace(/</g,'&lt;')]);render();const r=await aiOr(`Sohbet partneri ol. ${LANGS[S.lang].n} kısa cevap ver, sonra bir soru sor. Öğrenci: ${t}`,'Nice to meet you! What do you like to do on weekends?');chat.push(['ai',r.replace(/</g,'&lt;').replace(/\n/g,'<br>')]);S.xp+=5;render();$('#ch').lastElementChild.scrollIntoView()}
function shop(){return `<h2>Mağaza</h2><p>Kazandığın 💎 ile avatarını süsle.</p>${avatar()}<div class="grid" style="margin-top:14px">${SHOP.map(([e,p])=>{const o=S.own.includes(e);return `<button class="item ${S.acc==e?'eq':''}" onclick="buy('${e}',${p})"><span>${e}</span>${o?(S.acc==e?'Takılı':'Tak'):'💎 '+p}</button>`}).join('')}</div>`}
function buy(e,p){if(!S.own.includes(e)){if(S.gems<p)return toast('Yeterli 💎 yok');S.gems-=p;S.own.push(e)}S.acc=S.acc==e?'':e;render()}
function profile(){return `${avatar()}<h2 style="text-align:center">Avatarını yarat</h2><div class="row" style="justify-content:center">${FACES.map(f=>`<button class="item" style="flex:0 0 52px" onclick="S.face='${f}';render()">${f}</button>`).join('')}</div><div class="row" style="justify-content:center;margin:10px 0">${BGS.map(c=>`<button class="sw" style="background:${c};flex:0 0 30px" onclick="S.bg='${c}';render()"></button>`).join('')}</div>
<div class="card"><b>${LANGS[S.lang].n} · ${S.level}</b><p>🔥 ${S.streak} günlük seri · ⭐ ${S.xp} XP</p></div>
<button class="btn ghost" onclick="S.step=0;render()">API anahtarını / dili değiştir</button>`}
render();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
